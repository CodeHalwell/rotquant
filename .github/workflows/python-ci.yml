name: Python CI

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Ruff
        run: |
          uv sync --extra dev
          uv run ruff check .

  tests:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install (core + dev + eval)
        run: uv sync --extra dev --extra eval
      # cmake is preinstalled on the runner; tests/test_native_cpp.py needs it
      # so the cross-language native conformance suite runs instead of skipping.
      - name: Ensure native suite cannot silently skip
        run: cmake --version
      - name: Pytest
        run: uv run pytest tests/ -q --cov=rotquant --cov-report=term
