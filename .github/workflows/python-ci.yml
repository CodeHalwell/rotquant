name: Python CI

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Ruff
        run: |
          uv sync --locked --extra dev
          uv run --no-sync ruff check .

  tests:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # tests/test_fresh_quality_reuse.py diffs the checkout against the
          # reviewed producer revision with `git show`/`git diff`; a shallow
          # clone cannot resolve that commit and the guard would not run.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install (core + dev + eval)
        run: uv sync --locked --extra dev --extra eval
      - name: Verify notebook dependency and test collection
        run: |
          uv run --no-sync python -c "import nbformat"
          uv run --no-sync pytest tests/ --collect-only -q
      # cmake is preinstalled on the runner; tests/test_native_cpp.py needs it
      # so the cross-language native conformance suite runs instead of skipping.
      - name: Ensure native suite cannot silently skip
        run: cmake --version
      - name: Pytest
        env:
          # History-dependent guards must run here, never skip.
          ROTQUANT_REQUIRE_GIT_HISTORY: "1"
        run: uv run --no-sync pytest tests/ -q --cov=rotquant --cov-report=term
