# E6 scalar control only: 2-bit FWHT + scalar GPTQ.
# A fixed-rate vector/trellis codec is not integrated yet; this config cannot by
# itself support a scalar-vs-vector conclusion. Compare with a prequantized AQLM
# baseline through baselines/run_baseline.py when an exactly matching model exists.
experiment: E6
experiment_status: scalar_control_only
label: e6_fwht_scalar_2bit
calibrate: true
quant: {bits: 2, codebook: gaussian, scale: mse_search, group_size: 128, error_comp: gptq}
patch: {rotation: fwht, block: 128, mode: consistent}
eval: {perplexity: true, ppl_datasets: [wikitext2, c4], zeroshot: true}
