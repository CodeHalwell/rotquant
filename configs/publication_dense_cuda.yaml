# Publication-grade dense decoder protocol. The suite runner overrides the
# pinned model id/revision and smoke-vs-full evaluation budget.
experiment: PAPER_DENSE
label: paper_dense_rotquant_w4
model: Qwen/Qwen3-4B
model_revision: 1cfa9a7208912126459214e8b04321603b3df60c
model_loader: causal_lm
device: cuda
dtype: float16
seed: 0
n_calib: 128
calib_seq_len: 2048
quant:
  bits: 4
  codebook: gaussian
  scale: mse_search
  group_size: 128
  error_comp: none
patch:
  rotation: fwht
  block: 128
  mode: consistent
  fallback: false
  exclude: [lm_head, embed_out]
eval:
  perplexity: true
  ppl_datasets: [wikitext2, c4]
  ppl:
    seq_len: 2048
    max_samples: null
  zeroshot: true
  tasks: [arc_challenge, arc_easy, boolq, piqa, winogrande, hellaswag]
