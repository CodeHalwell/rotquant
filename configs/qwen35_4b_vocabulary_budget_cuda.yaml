# Nine-arm factorial: {FP16,W4,W5} backbone x {FP16,W8,W6} tied vocabulary.
# This is a dense quality prototype. Projected storage never passes export gates.
experiment: QWEN35_VOCABULARY_BUDGET_V1
label: qwen35_4b_vocabulary_budget
model: unsloth/Qwen3.5-4B
model_revision: 3764fa359b9082ea5a1e4a5e3ac3aaf6e9671636
model_loader: multimodal_lm
calib_dataset_revision: 1588ec454efa1a09f29cd18ddd04fe05fc8653a2
device: cuda
dtype: float16
seed: 0
n_calib: 128
calib_seq_len: 512
hessian_collection: streamed
hessian_layers_per_pass: 4
quant:
  bits: 4
  codebook: gaussian
  scale: mse_search
  scale_bits: 8
  collect_scale_diagnostics: true
  group_size: 128
  error_comp: gptq
  gptq_block: 128
  gptq_actorder: true
  gptq_recompute_scales: true
  bias_correction: none
patch:
  rotation: fwht
  block: 128
  mode: consistent
  share_rotations: false
  fallback: true
  include: [model.language_model.layers.]
  exclude: [linear_attn.in_proj_a, linear_attn.in_proj_b, lm_head, embed_out]
vocabulary:
  group_size: 128
  block: 128
  chunk_rows: 1024
target_artifact_bytes: 3584533344
artifact_overhead_estimate_bytes: 20750000
eval:
  perplexity: true
  ppl_datasets: [wikitext2, c4]
  ppl: {seq_len: 2048, max_samples: 32}
  zeroshot: false
  throughput: false
  logit_fidelity:
    batches: 24
    prompt_len: 512
    skip: 4096
    bootstrap_draws: 4000
  logit_fidelity_suites:
    diverse:
      batches: 25
      prompt_len: 512
      prompt_file: research/eval_suites/qwen35_diverse_development_v1.json
      prompt_field: text
      bootstrap_draws: 4000
  fail_fast: {mean_teacher_kl_max: 0.25, top1_agreement_min: 0.75}
  trajectory_suites:
    diverse:
      batches: 25
      prompt_len: 256
      new_tokens: 32
      prompt_file: research/eval_suites/qwen35_diverse_development_v1.json
      prompt_field: prompt
      bootstrap_draws: 4000
