# Long-context confirmation for the promoted Qwen3.5-4B RotQuant recipe.
# Four disjoint 8k prefill/64-token continuation pairs are deliberately costly:
# this is the first protocol where KV storage dominates and tiering is meaningful.
experiment: QWEN35_LONG_CONTEXT_KV_CUDA
label: qwen35_4b_long_context_tiered_kv_cuda
model: unsloth/Qwen3.5-4B
model_revision: 3764fa359b9082ea5a1e4a5e3ac3aaf6e9671636
calib_dataset_revision: 1588ec454efa1a09f29cd18ddd04fe05fc8653a2
model_loader: multimodal_lm
device: cuda
dtype: float16
seed: 0
calib_seq_len: 128
rotation_n_calib: 8
bias_n_calib: 32
quant:
  bits: 4
  codebook: gaussian
  scale: mse_search
  scale_bits: 8
  scale_quant_group_size: 256
  group_size: 128
  error_comp: none
  bias_correction: mean
patch:
  rotation: fwht
  block: 128
  mode: consistent
  share_rotations: true
  fallback: true
  include: [model.language_model.layers.]
  exclude: [linear_attn.in_proj_a, linear_attn.in_proj_b, lm_head, embed_out]
eval:
  perplexity: false
  zeroshot: false
  kv_cache:
    bits: 3
    key_bits: 3
    value_bits: 3
    group_size: 64
    scale_bits: 8
    scale_quant_group_size: 256
    codebook: gaussian
    rotation_block: 128
    sink_tokens: 4
    recent_window: 32
    batches: 4
    eval_offset_batches: 4
    prompt_len: 8192
    continuation_len: 64
    skip: 8192
    bootstrap_draws: 4000
    bootstrap_seed: 1701
